<html>
<head>
    <title>Projekt</title>
    <script src="https://unpkg.com/react/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"></link>
</head>
<body>
    <div id="app"></div>
    <script type="text/babel">
        const products = [
            {
                image: "./logo512.png",
                brand: "Merchcode",
                description: "T-shirt z nadrukiem",
                price: "119,00 zł"
            },
            {
                image: "./logo512.png",
                brand: "GAP",
                description: "T-shirt z nadrukiem",
                price: "74,00 zł"
            },
            {
                image: "./logo512.png",
                brand: "Tommy Hilfiger",
                description: "T-shirt z nadrukiem",
                price: "159,00 zł"
            },
            {
                image: "./logo512.png",
                brand: "Mister Tee",
                description: "T-shirt z nadrukiem",
                price: "59,00 zł"
            },
            {
                image: "./logo512.png",
                brand: "Forgotten Faces",
                description: "T-shirt z nadrukiem",
                price: "od 159,00 zł"
            },
            {
                image: "./logo512.png",
                brand: "Next",
                description: "T-shirt basic",
                price: "111,00 zł"
            }
        ];

        function App() {
            return (
                <div className="container mx-auto p-4">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {products.map((product, index) => (
                            <div key={index} className="border p-4">
                                <div className="relative">
                                    <img src={product.image} alt={product.alt} className="w-full h-auto" />
                                </div>
                                <div className="mt-4">
                                    <h2 className="text-lg font-semibold">{product.brand}</h2>
                                    <p className="text-gray-600">{product.description}</p>
                                    <p className="text-black font-bold">{product.price}</p>
                                    {product.additionalInfo && <p className="text-gray-500 text-sm">{product.additionalInfo}</p>}
                                    {product.regularPrice && <p className="text-gray-500 text-sm">{product.regularPrice}</p>}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('app'));
    </script>
</body>
</html>
